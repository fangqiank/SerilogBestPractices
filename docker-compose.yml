services:
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"  # Ingest 端口
      - "8081:80"    # Dashboard 端口
    volumes:
      - seq_data:/data
    restart: unless-stopped

volumes:
  seq_data:
